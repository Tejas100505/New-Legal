# ══════════════════════════════════════════════════════════════════════════════
# Agentic AI E-Discovery — Docker Compose Dev Overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# ══════════════════════════════════════════════════════════════════════════════

services:
  # ── Backend (hot-reload) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: ediscovery-backend-dev
    environment:
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_LOG_LEVEL=DEBUG
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
    volumes:
      - ./backend:/app            # Hot-reload via volume mount
      - /app/__pycache__          # Exclude pycache
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  # ── Frontend (Vite dev server) ─────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: ediscovery-frontend-dev
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules          # Use container's node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on:
      - backend
